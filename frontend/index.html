<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EagleEye</title>
  <meta name="description" content="EagleEye: an AI vision coach for footballers, built on synthetic data with fictional Blue and Red teams.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23be123c'/%3E%3Cpath d='M7 21c0-7 5-12 12-12 3 0 5.5 1 7 3l-3.5 1.5c1.2 1 1.6 2.4 1.2 3.8l-3.6-1.2c-1 2.6-3.6 4.3-6.6 4.6L7 25z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Sora:wght@500..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="16" fill="#be123c"/>
        <path d="M7 21c0-7 5-12 12-12 3 0 5.5 1 7 3l-3.5 1.5c1.2 1 1.6 2.4 1.2 3.8l-3.6-1.2c-1 2.6-3.6 4.3-6.6 4.6L7 25z" fill="#fff"/>
        <path d="M22.5 13.5l3.5-1.5-1.6 3z" fill="#f5b301"/>
        <circle cx="19.6" cy="13.4" r="1.3" fill="#1d1416"/>
      </svg>
      <span class="brand-name">EagleEye</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Mode">
      <button id="tab-analyse" class="tab on" role="tab" aria-selected="true">Analyse</button>
      <button id="tab-train" class="tab" role="tab" aria-selected="false">Train</button>
      <button id="tab-progress" class="tab" role="tab" aria-selected="false">Progress</button>
    </nav>
    <label class="nav-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="moment-search" type="search" placeholder="Search moments…" aria-label="Search moments" autocomplete="off">
    </label>
    <div class="topbar-right">
      <span id="knowledge-badge" class="badge knowledge" title="Coaching knowledge used by the agents (File Search). It changes only through KnowledgeScout research the coach approved."></span>
      <button id="scout-toggle" class="badge scout" type="button" aria-expanded="false" aria-controls="scout-panel" title="KnowledgeScout: background web research that grows the football reference. Proposals wait for your approval.">Scout</button>
      <span id="mode-badge" class="badge">Connecting…</span>
      <button id="avatar" class="avatar" type="button" title="Who's playing?" aria-label="Who's playing?">?</button>
    </div>
  </header>
  <aside id="scout-panel" class="scout-panel" hidden aria-label="KnowledgeScout proposals"></aside>

  <main class="layout" id="analyse-view">
    <aside id="moments-col" class="sidebar" aria-label="The match's moments"></aside>

    <section class="stage">
      <div class="page-head">
        <div class="kicker" id="scenario-kicker">Your match · Blue v Red</div>
        <h1 id="scenario-title" class="page-title">Analyse</h1>
        <p id="scenario-description" class="scenario-description"></p>
      </div>

      <div class="pitch-wrap" id="pitch-wrap">
        <canvas id="pitch" aria-label="Bird's-eye view of the pitch"></canvas>
        <div id="scoreboard" class="scoreboard" hidden></div>
        <div id="pitch-hint" class="pitch-hint" hidden></div>
      </div>

      <div class="controls" aria-label="Playback and tools">
        <button id="btn-restart" class="icon-btn" title="Rewind to start" aria-label="Rewind to start">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14l-10-7z"/></svg>
        </button>
        <button id="btn-back" class="icon-btn" title="Previous frame (←)" aria-label="Previous frame">
          <svg viewBox="0 0 24 24"><path d="M15 5v14l-9-7z"/></svg>
        </button>
        <button id="btn-play" class="icon-btn primary" title="Play / Pause (Space)" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" style="display: none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button id="btn-forward" class="icon-btn" title="Next frame (→)" aria-label="Next frame">
          <svg viewBox="0 0 24 24"><path d="M9 5v14l9-7z"/></svg>
        </button>
        <div class="timeline">
          <input id="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="Timeline">
          <div id="timeline-marks" class="timeline-marks"></div>
        </div>
        <span id="time-label" class="time-label">0.0 s</span>
        <label class="toggle" title="Simplified pitch control × threat: gold = valuable space the selected team can win">
          <input id="heatmap-toggle" type="checkbox"> Space
        </label>
        <button id="pov-toggle" class="pill-btn" type="button" aria-pressed="false" aria-controls="pov-card" title="Player's view: see the moment through your eyes (V)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.2 1.5 12c1.2 2.8 5 7 10.5 7s9.3-4.2 10.5-7C21.3 9.2 17.5 5 12 5zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
          <span class="pov-label">Player's view</span>
        </button>
        <select id="situation-select" class="mini-select" aria-label="Match situation" title="Match situation: the same moment under a different score and minute"></select>
        <select id="speed-select" class="mini-select" aria-label="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
        <select id="scenario-select" hidden aria-label="Scenario"></select>
      </div>

      <div id="pick-card" class="card pick-card" aria-live="polite"></div>
    </section>

    <div class="side">
      <aside class="panel" id="panel" aria-live="polite"></aside>
      <section id="pov-card" class="card pov-card" hidden aria-label="Player's view">
        <div class="pov-head">
          <h3 id="pov-title">Player's view</h3>
          <span id="pov-yaw" class="pov-yaw">Facing the ball</span>
        </div>
        <div class="pov-wrap">
          <canvas id="pov-canvas" tabindex="0" aria-label="First-person view of the selected player. Use the left and right arrow keys or drag to look around; 0 faces the ball."></canvas>
          <div id="pov-empty" class="pov-empty">Click a player on the pitch to see through their eyes</div>
        </div>
        <p class="sub pov-note">Numbers are only readable in the centre of vision, as in Train.</p>
      </section>
    </div>
  </main>

  <section id="train-view" class="train-view" hidden aria-label="Train">
    <div class="train-stage" id="train-stage">
      <canvas id="train-pov" aria-label="What you see from your own eyes"></canvas>
      <div id="train-hud" class="train-hud" hidden>
        <div class="hud-pill-bar" role="status">
          <svg class="hud-compass" viewBox="0 0 40 40" aria-label="Head direction: up is the ball">
            <circle cx="20" cy="20" r="18" fill="#fff" stroke="#ece4e6" stroke-width="2"/>
            <circle cx="20" cy="5" r="2.5" fill="#1d1416"/>
            <g id="hud-needle">
              <path d="M20 20 L33 7 A18 18 0 0 0 7 7 Z" fill="rgba(190,18,60,0.14)"/>
              <line x1="20" y1="20" x2="20" y2="6" stroke="#be123c" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <circle cx="20" cy="20" r="2.5" fill="#be123c"/>
          </svg>
          <svg class="hud-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.2 1.5 12c1.2 2.8 5 7 10.5 7s9.3-4.2 10.5-7C21.3 9.2 17.5 5 12 5zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z"/></svg>
          <span class="hud-scans"><strong id="hud-scans">Scans 0</strong> <span id="hud-aim" class="hud-aim"></span></span>
          <span class="hud-sep" aria-hidden="true"></span>
          <span class="hud-label">Ball arrives</span>
          <div class="hud-bar" aria-label="Time until the ball arrives"><div id="hud-bar-fill"></div></div>
          <strong id="hud-time" class="hud-time">0.0 s</strong>
        </div>
        <div class="hud-keys"><kbd>A</kbd><kbd>W</kbd><kbd>D</kbd><span>to look · let go for the ball</span></div>
        <div class="hud-touch">
          <button class="hud-look left" data-look="left">◀ Look left</button>
          <button class="hud-look body" data-body>Open ↑</button>
          <button class="hud-look right" data-look="right">Look right ▶</button>
        </div>
      </div>
      <div id="train-layer" class="train-layer"></div>
    </div>
    <div id="train-page" class="train-page" hidden></div>
  </section>

  <section id="progress-view" class="progress-view" hidden aria-label="Your progress"></section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
